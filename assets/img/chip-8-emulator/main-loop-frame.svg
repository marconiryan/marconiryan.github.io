<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' viewBox='23 0 722 544' width='722' height='544' font-family="Avenir, 'Avenir Next LT Pro', Corbel, 'URW Gothic', source-sans-pro, sans-serif" font-size='13'><defs><marker id='frame-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5f5f5f'/></marker></defs><text x='24' y='30' font-size='15' font-weight='600' fill='#ededed'>Every 1/60 s frame runs a batch of instructions, then ticks the timers once</text><text x='24' y='50' font-size='11.5' fill='#a3a3a3'>One frame at 700 instructions per second; only the batch size changes when you change the speed</text><g fill='none' stroke='#5f5f5f' stroke-width='1.25'><path d='M340 132V156' marker-end='url(#frame-arrow)'/><path d='M340 212V236' marker-end='url(#frame-arrow)'/><path d='M340 292V316' marker-end='url(#frame-arrow)'/><path d='M340 372V396' marker-end='url(#frame-arrow)'/><path d='M340 452V476' marker-end='url(#frame-arrow)'/><path d='M200 504H170V104H200' marker-end='url(#frame-arrow)'/><path d='M624 200V220' marker-end='url(#frame-arrow)'/><path d='M624 260V280' marker-end='url(#frame-arrow)'/><path d='M712 300H728V180H712' marker-end='url(#frame-arrow)'/><path d='M480 184H520' stroke-dasharray='4 4'/></g><text x='162' y='308' font-size='11.5' text-anchor='end' fill='#a3a3a3'>next frame</text><rect x='200' y='76' width='280' height='56' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='216' y='100' font-weight='600' fill='#ededed'>Read the keyboard</text><text x='216' y='118' font-size='11.5' fill='#a3a3a3'>update the 16 key states</text><rect x='200' y='156' width='280' height='56' rx='8' fill='#4c8dff' fill-opacity='0.16' stroke='#4c8dff' stroke-width='2'/><text x='216' y='180' font-weight='600' fill='#ededed'>Run a batch of instructions</text><text x='216' y='198' font-size='11.5' fill='#a3a3a3'>about 12 at 700 per second</text><rect x='200' y='236' width='280' height='56' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='216' y='260' font-weight='600' fill='#ededed'>Tick the timers</text><text x='216' y='278' font-size='11.5' fill='#a3a3a3'>each one: −1 if it is above 0</text><rect x='200' y='316' width='280' height='56' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='216' y='340' font-weight='600' fill='#ededed'>Show the screen</text><text x='216' y='358' font-size='11.5' fill='#a3a3a3'>copy the 64 × 32 buffer to the window</text><rect x='200' y='396' width='280' height='56' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='216' y='420' font-weight='600' fill='#ededed'>Update the beep</text><text x='216' y='438' font-size='11.5' fill='#a3a3a3'>on if the sound timer is above 0</text><rect x='200' y='476' width='280' height='56' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='216' y='500' font-weight='600' fill='#ededed'>Wait out the frame</text><text x='216' y='518' font-size='11.5' fill='#a3a3a3'>until 1/60 s has passed</text><rect x='520' y='128' width='224' height='208' rx='8' fill='#161616' stroke='#2c2c2c' stroke-width='1.25'/><text x='536' y='150' font-size='11.5' font-weight='600' fill='#a3a3a3'>STEP 2, REPEATED ABOUT 12×</text><rect x='536' y='160' width='176' height='40' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='552' y='185' font-weight='600' fill='#ededed'>Fetch</text><text x='700' y='185' font-size='11.5' text-anchor='end' fill='#a3a3a3'>PC += 2</text><rect x='536' y='220' width='176' height='40' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='552' y='245' font-weight='600' fill='#ededed'>Decode</text><text x='700' y='245' font-size='11.5' text-anchor='end' fill='#a3a3a3'>split nibbles</text><rect x='536' y='280' width='176' height='40' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='552' y='305' font-weight='600' fill='#ededed'>Execute</text><text x='700' y='305' font-size='11.5' text-anchor='end' fill='#a3a3a3'>change state</text></svg>