<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns='http://www.w3.org/2000/svg' viewBox='15 0 730 544' width='730' height='544' font-family="Avenir, 'Avenir Next LT Pro', Corbel, 'URW Gothic', source-sans-pro, sans-serif" font-size='13'><defs><marker id='arch-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#5f5f5f'/></marker></defs><text x='16' y='30' font-size='15' font-weight='600' fill='#ededed'>The loop in the middle reads and changes every other part</text><text x='16' y='50' font-size='11.5' fill='#a3a3a3'>Two-headed arrows are read and written; one-headed arrows show which way data flows</text><rect x='16' y='64' width='728' height='336' rx='8' fill='none' stroke='#2c2c2c' stroke-width='1.25'/><text x='32' y='88' font-size='11.5' font-weight='600' fill='#a3a3a3'>EMULATOR CORE: STATE + LOOP</text><rect x='16' y='424' width='728' height='108' rx='8' fill='#161616' stroke='#2c2c2c' stroke-width='1.25'/><text x='32' y='448' font-size='11.5' font-weight='600' fill='#a3a3a3'>FRONT END</text><g fill='none' stroke='#5f5f5f' stroke-width='1.25'><path d='M240 140H280' marker-start='url(#arch-arrow)' marker-end='url(#arch-arrow)'/><path d='M240 236H280' marker-start='url(#arch-arrow)' marker-end='url(#arch-arrow)'/><path d='M480 140H520' marker-start='url(#arch-arrow)' marker-end='url(#arch-arrow)'/><path d='M480 236H520' marker-start='url(#arch-arrow)' marker-end='url(#arch-arrow)'/><path d='M380 272V312' marker-end='url(#arch-arrow)'/><path d='M220 312V292H330V272' marker-end='url(#arch-arrow)'/><path d='M620 272V312' marker-end='url(#arch-arrow)'/><path d='M140 460V384' marker-end='url(#arch-arrow)'/><path d='M380 384V460' marker-end='url(#arch-arrow)'/><path d='M620 384V460' marker-end='url(#arch-arrow)'/></g><rect x='40.0' y='104' width='200' height='72' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='52.0' y='128' font-weight='600' fill='#ededed'>Memory (4096 bytes)</text><text x='52.0' y='146' font-size='11.5' fill='#a3a3a3'>font below 0x200</text><text x='52.0' y='162' font-size='11.5' fill='#a3a3a3'>program from 0x200</text><rect x='40.0' y='200' width='200' height='72' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='52.0' y='224' font-weight='600' fill='#ededed'>Stack</text><text x='52.0' y='242' font-size='11.5' fill='#a3a3a3'>return addresses</text><text x='52.0' y='258' font-size='11.5' fill='#a3a3a3'>push: 2NNN, pop: 00EE</text><rect x='520.0' y='104' width='200' height='72' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='532.0' y='128' font-weight='600' fill='#ededed'>Registers</text><text x='532.0' y='146' font-size='11.5' fill='#a3a3a3'>V0–VF: 1 byte each</text><text x='532.0' y='162' font-size='11.5' fill='#a3a3a3'>I: an address, PC: next</text><rect x='520.0' y='200' width='200' height='72' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='532.0' y='224' font-weight='600' fill='#ededed'>Timers</text><text x='532.0' y='242' font-size='11.5' fill='#a3a3a3'>delay and sound</text><text x='532.0' y='258' font-size='11.5' fill='#a3a3a3'>−1 sixty times a second</text><rect x='280.0' y='104' width='200' height='168' rx='8' fill='#4c8dff' fill-opacity='0.16' stroke='#4c8dff' stroke-width='2'/><text x='292.0' y='130' font-size='14' font-weight='600' fill='#ededed'>The loop</text><text x='292.0' y='158' fill='#ededed'>1  fetch 2 bytes at PC</text><text x='292.0' y='178' fill='#ededed'>2  PC moves forward 2</text><text x='292.0' y='198' fill='#ededed'>3  decode the nibbles</text><text x='292.0' y='218' fill='#ededed'>4  execute it</text><text x='292.0' y='252' font-size='11.5' fill='#a3a3a3'>about 700 per second</text><rect x='40.0' y='312' width='200' height='72' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='52.0' y='336' font-weight='600' fill='#ededed'>Keypad state</text><text x='52.0' y='354' font-size='11.5' fill='#a3a3a3'>16 keys: down or up</text><text x='52.0' y='370' font-size='11.5' fill='#a3a3a3'>read by EX9E, EXA1, FX0A</text><rect x='280.0' y='312' width='200' height='72' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='292.0' y='336' font-weight='600' fill='#ededed'>Screen buffer</text><text x='292.0' y='354' font-size='11.5' fill='#a3a3a3'>64 × 32 pixels, on or off</text><text x='292.0' y='370' font-size='11.5' fill='#a3a3a3'>changed by 00E0 and DXYN</text><rect x='520.0' y='312' width='200' height='72' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='532.0' y='336' font-weight='600' fill='#ededed'>Beep</text><text x='532.0' y='354' font-size='11.5' fill='#a3a3a3'>on while the sound</text><text x='532.0' y='370' font-size='11.5' fill='#a3a3a3'>timer is above 0</text><rect x='40.0' y='460' width='200' height='56' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='52.0' y='484' font-weight='600' fill='#ededed'>Keyboard</text><text x='52.0' y='502' font-size='11.5' fill='#a3a3a3'>1234 / QWER / ASDF / ZXCV</text><rect x='280.0' y='460' width='200' height='56' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='292.0' y='484' font-weight='600' fill='#ededed'>Window</text><text x='292.0' y='502' font-size='11.5' fill='#a3a3a3'>pixels drawn as big squares</text><rect x='520.0' y='460' width='200' height='56' rx='8' fill='none' stroke='#5f5f5f' stroke-width='1.25'/><text x='532.0' y='484' font-weight='600' fill='#ededed'>Speaker</text><text x='532.0' y='502' font-size='11.5' fill='#a3a3a3'>plays a simple tone</text></svg>