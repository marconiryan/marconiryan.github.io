---
layout: default
---
<ul class="post-list">
  {%- for post in site.posts %}
  <li>
    <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <span class="chip">{{ post.date | date: "%b %-d, %Y" }}</span>
    {%- if post.description %}
    <p>{{ post.description }}</p>
    {%- endif %}
  </li>
  {%- endfor %}
</ul>
